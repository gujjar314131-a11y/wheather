<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="new.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="main">
       <div class="new">
        <div class="a">
            <div class="heading">
            <h1>Weather Explore</h1>
            </div>
        <p>Stay updated with the latest weather conditions.</p>
        </div>
        <form class="search" role="search">
            <input id="city" name="city" type="search" placeholder="Calaber" required>
            <button type="submit">Search</button>
        </form>
        <div class="firstbox">
            <div class="icon"></div>
            <div class="t">
                <h2>Calaber</h2>
            <p>Temperature: 35.09&deg;C</p>
            <p>clear sky</p>
            </div>
        </div>
        <div class="parent">
            <div class="secondbox">
                <h2>Monday</h2>
                <div class="icon2">
                </div>
                <p>34&deg;C</p>
            </div>
            <div class="thridbox">
                <h2>tuesday</h2>
                <div class="icon3">
                    <i class="fa-solid fa-cloud" aria-hidden="true"></i>
                </div>
                <p>31&deg;C</p>
            </div>
            <div class="fourthbox">
                <h2>wednesday</h2>
                <div class="icon4">
                    <i class="fa-solid fa-cloud" aria-hidden="true"></i>
                </div>
                <p>32&deg;C</p>
            </div>
            <div class="fivethbox">
                <h2>thursday</h2>
                <div class="icon5">
                    <i class="fa-solid fa-cloud" aria-hidden="true"></i>
                </div>
                <p>33&deg;C</p>
            </div>
        </div> 
       </div>    
    </div>
</body>
</html>
